[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "asqav"
version = "0.10.14"
description = "AI agent governance - audit trails, policy enforcement, compliance"
readme = "README.md"
license = "LicenseRef-Elastic-License-2.0 AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/Apache-2.0.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Asqav", email = "info@asqav.com" }
]
keywords = [
    "ai",
    "agents",
    "governance",
    "audit-trail",
    "compliance",
    "eu-ai-act",
    "policy-enforcement",
    "langchain",
    "crewai",
    "ml-dsa",
    "ai-security",
    "openai-agents",
    "haystack",
    "llamaindex",
    "smolagents",
    "dspy",
    "strands-agents",
    "openai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.24.0"]
# Standalone receipt verifier (verifier/verify_receipt.py). Pure-python FIPS 204
# ML-DSA-65 so a buyer can verify a receipt offline without liboqs. cryptography
# carries the Ed25519 and ES256 axes; without it those signatures downgrade to
# INCOMPLETE rather than verifying. The main SDK defers signing to the cloud.
verify = ["dilithium-py>=1.0.0", "cryptography>=42"]
cli = ["typer>=0.12.0", "httpx>=0.24.0"]
# Customer-bucket archive copies (criterion 761): S3 with Object Lock,
# written with the customer's own credentials via the standard chain.
s3 = ["boto3>=1.35.0"]
langchain = ["langchain-core>=0.2.0"]
# crewai hard-requires chromadb, which OSV lists with CVE-2026-45829, -45830, -45831 and -45833
# at its newest release (2026-10-25); the opt-in extra installs what the user asked for.
crewai = ["crewai>=0.95.0"]
litellm = ["litellm>=1.83.14,!=1.82.7,!=1.82.8"]
haystack = ["haystack-ai>=2.0.0"]
openai-agents = ["openai-agents>=0.1.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
llamaindex = ["llama-index-core>=0.11.0"]
smolagents = ["smolagents>=1.6.0"]
# dspy hard-requires diskcache, which OSV lists with CVE-2025-69872 (unsafe pickle) at 5.6.3.
dspy = ["dspy>=2.6.0"]
letta = ["letta-client>=1.10.0"]
strands = ["strands-agents>=0.1.0"]
instructor = ["instructor>=1.5.0"]
# Pluggable detector extras (criterion 331): optional, lazy-imported.
presidio = ["presidio-analyzer>=2.2.0"]
opa = []
# Microsoft Agent Governance Toolkit receipts (MIT); its wheels require Python 3.11+.
agt = ["agent-governance-toolkit-protocols==5.0.0; python_version >= '3.11'"]
all = [
    "httpx>=0.24.0",
    "typer>=0.12.0",
    # The verify extra belongs in all: without dilithium-py every ML-DSA-65 test
    # skips, so a CI run on this extra never executes the signature-path tests.
    "dilithium-py>=1.0.0",
    "cryptography>=42",
    "langchain-core>=0.2.0",
    # crewai, llamaindex, smolagents and dspy stay out of all: each has its own extra.
    "litellm>=1.83.14,!=1.82.7,!=1.82.8",
    "haystack-ai>=2.0.0",
    "openai-agents>=0.1.0",
    "letta-client>=1.10.0",
    "strands-agents>=0.1.0",
    "instructor>=1.5.0",
]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0", "mypy>=1.10.0",
       # Local S3-compatible store for archive-sync e2e (criterion 761).
       "moto[s3]>=5.0.0",
       # Real-process S3 endpoint for the --s3-endpoint-url e2e (761).
       "moto[server]>=5.0.0"]

[project.scripts]
asqav = "asqav.cli:app"

[project.entry-points.pytest11]
asqav = "asqav.pytest_plugin"

[project.urls]
Homepage = "https://asqav.com"
Documentation = "https://asqav.com/docs"
Repository = "https://github.com/jagmarques/asqav-sdk"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

# Into src/ on purpose: `python -m build` builds the wheel FROM the sdist,
# where ../ paths no longer resolve, so a wheel-stage force-include of the
# same files raises FileNotFoundError. Landing under src/asqav/ lets the
# wheel packages=["src/asqav"] pick the corpus up with no wheel mapping.
[tool.hatch.build.targets.sdist.force-include]
"../verifier/conformance-vectors" = "src/asqav/conformance_vectors"
"../conformance/NOTICE" = "src/asqav/conformance_vectors/NOTICE"
"../conformance/LICENSE" = "src/asqav/conformance_vectors/LICENSE"


[tool.hatch.build.targets.wheel]
packages = ["src/asqav"]


[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/asqav/cli.py" = ["E501"]
# The relocated neutral verifier carries long signed-message/error strings on one
# line so the reported note bytes stay greppable; line length is not enforced on it.
"src/asqav/verifier/**" = ["E501"]
# Corpus-B pins are single-line literals so a published value stays greppable;
# splitting them would hide drift. Length is not enforced on the pin dicts.
"tests/test_corpus_b_integrity.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
# The suite imports the tree under test: the source the editable install names
pythonpath = ["src"]

[tool.uv]
# The agt extra's upstream caps cryptography below 50; keep the dev lock on the patched release.
override-dependencies = ["cryptography>=50.0.0"]
