name: Registry drift
# Fails when the newest py-v*/ts-v* tag is missing from PyPI/npm or behind
# there, so a failed publish cannot go unseen
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_run:
    workflows: [Publish]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # After a publish the registries can lag a few minutes, so keep checking
      - run: python tools/check_registry_versions.py --wait ${{ github.event_name == 'workflow_run' && 600 || 0 }}
